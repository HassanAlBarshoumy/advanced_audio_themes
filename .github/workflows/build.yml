# Manual build-and-release for the add-on.
#
# There is NO automatic build. Nothing runs on push, on pull request or on a
# schedule: a package is produced only when it is asked for by hand.
#
#   Actions -> Build add-on -> Run workflow   (select the master branch)
#   gh workflow run build.yml --ref master
#
# A build is never produced without a release: the run builds the package from
# whatever manifest.ini says and then creates or refreshes the GitHub Release
# for that version, attaching the built .nvda-addon and its SHA-256 checksum.
#
# Releasing a NEW version number (bump manifest.ini + buildVars.py, tag it) is
# handled by release.yml. This workflow never changes the version; it only
# rebuilds and republishes whatever manifest.ini already says.
name: Build add-on

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .nvda-addon and publish its release
    # A build only ever happens together with a release, and releases are cut
    # from master, so a run from any other branch is skipped rather than
    # producing a package that has nowhere to be published.
    if: github.ref == 'refs/heads/master'
    # Pinned: the ubuntu-latest label migrates to Ubuntu 26 after 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13 (the interpreter NVDA 2026.x ships)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify that manifest.ini and buildVars.py agree
        run: python scripts/addon_version.py check

      - name: Syntax-check every Python source
        run: python -m compileall -q installTasks.py build_addon.py scripts globalPlugins

      - name: Build the package
        id: build
        run: python build_addon.py

      - name: Write the SHA-256 checksum
        run: sha256sum "${{ steps.build.outputs.filename }}" > "${{ steps.build.outputs.filename }}.sha256"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: advanced_audio_themes-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.filename }}
            ${{ steps.build.outputs.filename }}.sha256
          if-no-files-found: error
          retention-days: 30

      # A build always ends in a release: the version is not changed here, the
      # release for whatever manifest.ini says is created, or refreshed in
      # place when it already exists.
      - name: Publish the GitHub Release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          FILENAME: ${{ steps.build.outputs.filename }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: refreshing its assets from $COMMIT."
            gh release upload "$TAG" "$FILENAME" "$FILENAME.sha256" --clobber
          else
            echo "Creating release $TAG from $COMMIT."
            gh release create "$TAG" "$FILENAME" "$FILENAME.sha256" \
              --target "$COMMIT" \
              --title "$TAG" \
              --notes "Built on request from master (commit $COMMIT)."
          fi
          echo "Release $TAG now carries $FILENAME."
